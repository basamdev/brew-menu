    <rect x="76" y="-55" width="36" height="14"/>
    <!-- AKBAR (Left side in Arabic) -->
    <path d="M -150,35 L -150,-35 L -134,-35 L -134,20 L -114,20 L -114,-35 L -98,-35 L -98,35 Z"/>
    <path d="M -80,35 L -80,-15 L -20,-15 L -20,-35 L -80,-35 L -80,-35 L -5,-35 L -5,5 L -62,5 L -62,20 L 5,20 L 5,35 Z"/>
    <rect x="-134" y="-55" width="20" height="14"/>
    <rect x="-45" y="-12" width="16" height="12"/>
  </g>
</svg>
