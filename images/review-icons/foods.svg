<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="foodShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C2D12" flood-opacity="0.32" />
    </filter>
    <radialGradient id="foodAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="domeGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>
    <linearGradient id="platterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="handleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="domeGloss" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#foodAura)" />

  <!-- Ethereal Culinary Aroma Steam -->
  <path d="M25 14 Q23 9 27 6 Q30 3 28 0" stroke="url(#steamGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.65" />
  <path d="M34 13 Q38 8 35 4 Q32 1 36 -2" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />

  <g filter="url(#foodShadow)">
    <!-- Serving Platter Tray Base Under Shadow -->
    <ellipse cx="32" cy="52" rx="27" ry="6" fill="#78350F" opacity="0.4" />

    <!-- Outer Platter Rim -->
    <ellipse cx="32" cy="49" rx="27" ry="5.5" fill="url(#platterGrad)" stroke="#FEF08A" stroke-width="0.8" />
    <!-- Inner Platter Surface -->
    <ellipse cx="32" cy="48" rx="24" ry="4" fill="#9A3412" />
    <ellipse cx="32" cy="47.5" rx="23" ry="3.5" fill="url(#platterGrad)" />

    <!-- Gourmet Cloche Dome Cover -->
    <path d="M12 47 C12 28 20 20 32 20 C44 20 52 28 52 47 Z" fill="url(#domeGrad)" stroke="#FEF3C7" stroke-width="1" />

    <!-- Cloche Bottom Rim Lip -->
    <path d="M10 47.5 C10 45.5 54 45.5 54 47.5 C54 49.5 10 49.5 10 47.5 Z" fill="url(#platterGrad)" stroke="#FFFBEB" stroke-width="0.8" />

    <!-- Gloss Specular Reflection Curve on Dome Left -->
    <path d="M16 44 C16 30 22 23 30 22" fill="none" stroke="url(#domeGloss)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Cloche Handle / Knob Mount -->
    <ellipse cx="32" cy="20" rx="3.5" ry="1.5" fill="#B45309" />
    <!-- Cloche Handle Sphere -->
    <circle cx="32" cy="16.5" r="4.5" fill="url(#handleGrad)" stroke="#FEF08A" stroke-width="0.8" />
    <circle cx="30.5" cy="14.8" r="1.3" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Sparkle on Dome Highlight -->
  <g transform="translate(23, 27)">
    <path d="M0 -5 Q0 0 5 0 Q0 0 0 5 Q0 0 -5 0 Q0 0 0 -5 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="0" r="1.2" fill="#FEF08A" />
  </g>

  <!-- Sparkle on Platter Right -->
  <g transform="translate(53, 44)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>
