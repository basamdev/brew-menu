<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="staffShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#B45309" flood-opacity="0.35" />
    </filter>
    <radialGradient id="staffAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="faceGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#staffAura)" />

  <g filter="url(#staffShadow)">
    <!-- Golden Head Sphere -->
    <circle cx="32" cy="27" r="19" fill="url(#faceGrad)" stroke="url(#rimGrad)" stroke-width="1.2" />

    <!-- Specular Highlight Curve on Forehead -->
    <path d="M22 17 C25 13 32 12 38 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Friendly Cheerful Smiling Eyes -->
    <path d="M22 25 Q26 21 30 25" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M34 25 Q38 21 42 25" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Rosy Blush Cheeks -->
    <ellipse cx="20" cy="29" rx="3.5" ry="2" fill="#F87171" opacity="0.45" />
    <ellipse cx="44" cy="29" rx="3.5" ry="2" fill="#F87171" opacity="0.45" />

    <!-- Warm Hospitality Smile with White Teeth -->
    <path d="M24 32 Q32 42 40 32 Z" fill="#78350F" />
    <path d="M26 32.5 Q32 38 38 32.5 Z" fill="#FFFFFF" />

    <!-- Luxury Concierge Bow Tie -->
    <g transform="translate(32, 50)">
      <!-- Left bow wing -->
      <polygon points="0,0 -13,-6 -13,6" fill="url(#tieGrad)" stroke="#FEF08A" stroke-width="0.8" />
      <!-- Right bow wing -->
      <polygon points="0,0 13,-6 13,6" fill="url(#tieGrad)" stroke="#FEF08A" stroke-width="0.8" />
      <!-- Center Knot -->
      <circle cx="0" cy="0" r="3.2" fill="url(#faceGrad)" stroke="#FFFBEB" stroke-width="0.8" />
    </g>
  </g>

  <!-- Sparkle (Top-Right) -->
  <g transform="translate(48, 12)">
    <path d="M0 -5 Q0 0 5 0 Q0 0 0 5 Q0 0 -5 0 Q0 0 0 -5 Z" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
