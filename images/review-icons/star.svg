<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Ambient Glow Filter -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#78350F" flood-opacity="0.35" />
    </filter>

    <!-- Gradients -->
    <radialGradient id="starGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#starGlowGrad)" />

  <!-- 3D Faceted Star (Center: 32, 33) -->
  <g filter="url(#dropShadow)">
    <!-- Top point -->
    <path d="M32 6 L32 33 L38 24 Z" fill="url(#goldLight)" />
    <path d="M32 6 L26 24 L32 33 Z" fill="url(#goldDark)" />

    <!-- Right top point -->
    <path d="M57 24 L32 33 L43 35 Z" fill="url(#goldLight)" />
    <path d="M57 24 L38 24 L32 33 Z" fill="url(#goldDark)" />

    <!-- Right bottom point -->
    <path d="M48 56 L32 33 L35 44 Z" fill="url(#goldLight)" />
    <path d="M48 56 L43 35 L32 33 Z" fill="url(#goldDark)" />

    <!-- Left bottom point -->
    <path d="M16 56 L29 44 L32 33 Z" fill="url(#goldLight)" />
    <path d="M16 56 L32 33 L21 35 Z" fill="url(#goldDark)" />

    <!-- Left top point -->
    <path d="M7 24 L32 33 L26 24 Z" fill="url(#goldLight)" />
    <path d="M7 24 L21 35 L32 33 Z" fill="url(#goldDark)" />

    <!-- Outer Rim Stroke for 3D Definition -->
    <polygon points="32,6 38,24 57,24 43,35 48,56 32,44 16,56 21,35 7,24 26,24" 
             fill="none" stroke="url(#goldRim)" stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- Specular Gloss Arc on Upper Facet -->
  <path d="M32 8 L36 22 L32 28 L28 22 Z" fill="url(#specularGlint)" opacity="0.75" />

  <!-- 4-point Diamond Sparkle (Top-Right) -->
  <g transform="translate(46, 10)">
    <path d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="0" r="1.5" fill="#FEF08A" />
  </g>

  <!-- Small Diamond Sparkle (Bottom-Left) -->
  <g transform="translate(12, 42)">
    <path d="M0 -4 Q0 0 4 0 Q0 0 0 4 Q0 0 -4 0 Q0 0 0 -4 Z" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
