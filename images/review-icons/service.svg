<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="serviceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#065F46" flood-opacity="0.35" />
    </filter>
    <radialGradient id="serviceAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bellDomeGrad" cx="38%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
    <linearGradient id="bellBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="bellGoldRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bellGloss" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="plungerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#serviceAura)" />

  <!-- Chime Resonance Rings / Sound Sparkles -->
  <path d="M16 16 C12 20 10 26 10 32" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M48 16 C52 20 54 26 54 32" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <g filter="url(#serviceShadow)">
    <!-- Base Bottom Pedestal -->
    <ellipse cx="32" cy="54" rx="26" ry="6" fill="#0B131F" opacity="0.4" />
    <ellipse cx="32" cy="51" rx="26" ry="5.5" fill="url(#bellBaseGrad)" stroke="#374151" stroke-width="1" />

    <!-- Gold Accent Ring on Base -->
    <ellipse cx="32" cy="49" rx="24" ry="4.5" fill="url(#bellGoldRing)" />
    <ellipse cx="32" cy="48" rx="23.5" ry="4.2" fill="url(#bellBaseGrad)" />

    <!-- Bell Dome -->
    <path d="M14 45.5 C14 26 21 21 32 21 C43 21 50 26 50 45.5 Z" fill="url(#bellDomeGrad)" stroke="#FEF3C7" stroke-width="0.8" />

    <!-- Flared Bell Lip -->
    <path d="M12 45.5 C12 43 52 43 52 45.5 C52 48 12 48 12 45.5 Z" fill="url(#bellGoldRing)" stroke="#FFFBEB" stroke-width="0.8" />

    <!-- Gloss Specular Highlight Curve on Bell Dome Left -->
    <path d="M18 42 C18 29 23 23 30 22.5" fill="none" stroke="url(#bellGloss)" stroke-width="3" stroke-linecap="round" />

    <!-- Plunger Shaft -->
    <rect x="30.5" y="15" width="3" height="7" rx="1.5" fill="url(#plungerGrad)" stroke="#9CA3AF" stroke-width="0.5" />

    <!-- Plunger Push Button / Cap -->
    <ellipse cx="32" cy="14" rx="6" ry="2.5" fill="url(#plungerGrad)" stroke="#D1D5DB" stroke-width="0.8" />
    <ellipse cx="32" cy="13.2" rx="4" ry="1.4" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- 4-point Chime Sparkle (Top-Right) -->
  <g transform="translate(45, 12)">
    <path d="M0 -6 Q0 0 6 0 Q0 0 0 6 Q0 0 -6 0 Q0 0 0 -6 Z" fill="#34D399" opacity="0.95" />
    <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" />
  </g>

  <!-- Top Center Bell Sparkle -->
  <g transform="translate(25, 26)">
    <path d="M0 -4.5 Q0 0 4.5 0 Q0 0 0 4.5 Q0 0 -4.5 0 Q0 0 0 -4.5 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
