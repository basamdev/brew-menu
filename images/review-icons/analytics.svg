<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="chartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
    <radialGradient id="chartAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#chartAura)" />

  <g filter="url(#chartShadow)">
    <!-- Base Platform Line -->
    <rect x="8" y="52" width="48" height="3" rx="1.5" fill="#334155" opacity="0.8" />

    <!-- Bar 1 (Short) -->
    <rect x="12" y="38" width="8" height="14" rx="3" fill="url(#bar1)" stroke="#93C5FD" stroke-width="0.8" />
    <!-- Bar 1 Cap Highlight -->
    <ellipse cx="16" cy="40" rx="3" ry="1.2" fill="#FFFFFF" opacity="0.7" />

    <!-- Bar 2 (Medium) -->
    <rect x="23" y="28" width="8" height="24" rx="3" fill="url(#bar2)" stroke="#C4B5FD" stroke-width="0.8" />
    <ellipse cx="27" cy="30" rx="3" ry="1.2" fill="#FFFFFF" opacity="0.7" />

    <!-- Bar 3 (Tall) -->
    <rect x="34" y="20" width="8" height="32" rx="3" fill="url(#bar3)" stroke="#FDE68A" stroke-width="0.8" />
    <ellipse cx="38" cy="22" rx="3" ry="1.2" fill="#FFFFFF" opacity="0.7" />

    <!-- Bar 4 (Peak) -->
    <rect x="45" y="12" width="8" height="40" rx="3" fill="url(#bar4)" stroke="#A7F3D0" stroke-width="0.8" />
    <ellipse cx="49" cy="14" rx="3" ry="1.2" fill="#FFFFFF" opacity="0.7" />

    <!-- Trend Arrow Line -->
    <path d="M14 34 Q30 20 49 8" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
    <!-- Arrow Head -->
    <polygon points="49,5 53,10 45,10" fill="#FBBF24" />
  </g>

  <!-- Sparkle on peak -->
  <g transform="translate(50, 6)">
    <path d="M0 -4 Q0 0 4 0 Q0 0 0 4 Q0 0 -4 0 Q0 0 0 -4 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
