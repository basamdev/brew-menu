<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="decorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#581C87" flood-opacity="0.35" />
    </filter>
    <radialGradient id="decorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="columnMarble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="25%" stop-color="#F5F3FF" />
      <stop offset="60%" stop-color="#DDD6FE" />
      <stop offset="85%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="goldCapital" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="columnGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#decorAura)" />

  <g filter="url(#decorShadow)">
    <!-- Top Abacus Architrave Slab -->
    <path d="M12 11 L52 11 L50 16 L14 16 Z" fill="url(#goldCapital)" stroke="#FEF3C7" stroke-width="0.8" />

    <!-- Ionic Volute Scrolls (Left & Right) -->
    <!-- Left Volute -->
    <circle cx="16" cy="20" r="5" fill="url(#goldCapital)" stroke="#FEF3C7" stroke-width="0.8" />
    <circle cx="16" cy="20" r="2.2" fill="#581C87" />
    <path d="M16 16 C22 16 23 22 23 24" stroke="#FFFBEB" stroke-width="1.2" fill="none" />

    <!-- Right Volute -->
    <circle cx="48" cy="20" r="5" fill="url(#goldCapital)" stroke="#FEF3C7" stroke-width="0.8" />
    <circle cx="48" cy="20" r="2.2" fill="#581C87" />
    <path d="M48 16 C42 16 41 22 41 24" stroke="#FFFBEB" stroke-width="1.2" fill="none" />

    <!-- Center Capital Floral Rosette / Cushion -->
    <rect x="20" y="16" width="24" height="7" rx="2" fill="url(#goldCapital)" stroke="#FEF3C7" stroke-width="0.7" />
    <ellipse cx="32" cy="19.5" rx="4" ry="2" fill="#FFFFFF" opacity="0.6" />

    <!-- Astragal Ring (Collar under Capital) -->
    <rect x="18" y="23" width="28" height="3" rx="1.5" fill="url(#goldCapital)" />

    <!-- Fluted Column Shaft -->
    <rect x="19" y="26" width="26" height="23" fill="url(#columnMarble)" stroke="#C4B5FD" stroke-width="0.8" />

    <!-- Flutes (Vertical Grooves with 3D Depth) -->
    <line x1="23" y1="26" x2="23" y2="49" stroke="#7C3AED" stroke-width="1.5" opacity="0.5" />
    <line x1="24.2" y1="26" x2="24.2" y2="49" stroke="#FFFFFF" stroke-width="1" opacity="0.85" />

    <line x1="29" y1="26" x2="29" y2="49" stroke="#7C3AED" stroke-width="1.5" opacity="0.5" />
    <line x1="30.2" y1="26" x2="30.2" y2="49" stroke="#FFFFFF" stroke-width="1" opacity="0.85" />

    <line x1="35" y1="26" x2="35" y2="49" stroke="#7C3AED" stroke-width="1.5" opacity="0.5" />
    <line x1="36.2" y1="26" x2="36.2" y2="49" stroke="#FFFFFF" stroke-width="1" opacity="0.85" />

    <line x1="41" y1="26" x2="41" y2="49" stroke="#7C3AED" stroke-width="1.5" opacity="0.5" />
    <line x1="42.2" y1="26" x2="42.2" y2="49" stroke="#FFFFFF" stroke-width="1" opacity="0.85" />

    <!-- Stepped Pedestal Base -->
    <!-- Base Torus Molding -->
    <rect x="18" y="49" width="28" height="3.5" rx="1.5" fill="url(#goldCapital)" stroke="#FEF3C7" stroke-width="0.7" />
    <!-- Lower Plinth Step -->
    <path d="M14 53 L50 53 L53 58 L11 58 Z" fill="url(#columnMarble)" stroke="#A78BFA" stroke-width="0.8" />
    <!-- Plinth Base Shadow Rim -->
    <rect x="9" y="58" width="46" height="2" rx="1" fill="url(#goldCapital)" />
  </g>

  <!-- Ambient Luxury Sparkle (Top-Left) -->
  <g transform="translate(10, 8)">
    <path d="M0 -5 Q0 0 5 0 Q0 0 0 5 Q0 0 -5 0 Q0 0 0 -5 Z" fill="#C084FC" opacity="0.95" />
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Ambient Luxury Sparkle (Bottom-Right) -->
  <g transform="translate(54, 45)">
    <path d="M0 -4 Q0 0 4 0 Q0 0 0 4 Q0 0 -4 0 Q0 0 0 -4 Z" fill="#FDE047" opacity="0.9" />
  </g>
</svg>
