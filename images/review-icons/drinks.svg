<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="drinkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
    <radialGradient id="drinkAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cocktailLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glassStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="citrusRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="strawGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#drinkAura)" />

  <g filter="url(#drinkShadow)">
    <!-- Golden Straw -->
    <path d="M26 4 L38 34" stroke="url(#strawGold)" stroke-width="3" stroke-linecap="round" />

    <!-- Citrus Slice on Rim -->
    <g transform="translate(43, 14)">
      <circle cx="0" cy="0" r="9" fill="url(#citrusRim)" stroke="#FEF08A" stroke-width="1.2" />
      <circle cx="0" cy="0" r="6.5" fill="#FEF08A" opacity="0.9" />
      <!-- Citrus segments -->
      <path d="M0 0 L-4 -4 M0 0 L4 -4 M0 0 L-4 4 M0 0 L4 4 M0 0 L0 -5.5 M0 0 L0 5.5 M0 0 L-5.5 0 M0 0 L5.5 0" stroke="#EA580C" stroke-width="0.9" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>

    <!-- Glass Bowl Back Rim -->
    <ellipse cx="32" cy="18" rx="18" ry="5.5" fill="#BAE6FD" opacity="0.3" stroke="#E0F2FE" stroke-width="1.2" />

    <!-- Cocktail Liquid -->
    <path d="M15 20 Q16 38 32 42 Q48 38 49 20 Z" fill="url(#cocktailLiquid)" />
    <!-- Liquid Surface Ellipse -->
    <ellipse cx="32" cy="20.5" rx="16.5" ry="4.5" fill="#22D3EE" opacity="0.8" />

    <!-- Ice Cubes inside -->
    <rect x="23" y="24" width="7" height="7" rx="1.5" transform="rotate(15 26 27)" fill="#FFFFFF" opacity="0.55" stroke="#E0F2FE" stroke-width="0.8" />
    <rect x="33" y="27" width="6.5" height="6.5" rx="1.5" transform="rotate(-20 36 30)" fill="#FFFFFF" opacity="0.5" stroke="#E0F2FE" stroke-width="0.8" />

    <!-- Bubbles -->
    <circle cx="28" cy="35" r="1.2" fill="#FFFFFF" opacity="0.8" />
    <circle cx="37" cy="36" r="0.9" fill="#FFFFFF" opacity="0.7" />
    <circle cx="31" cy="31" r="1.5" fill="#FFFFFF" opacity="0.75" />

    <!-- Glass Bowl Outer Silhouette -->
    <path d="M14 18 Q15.5 40 32 44 Q48.5 40 50 18" fill="none" stroke="url(#glassStem)" stroke-width="2" stroke-linecap="round" />

    <!-- Glass Stem -->
    <path d="M30.5 44 L30.5 54 L33.5 54 L33.5 44 Z" fill="url(#glassStem)" />

    <!-- Glass Base -->
    <ellipse cx="32" cy="56" rx="13" ry="3.5" fill="url(#glassStem)" stroke="#E0F2FE" stroke-width="1" />
    <ellipse cx="32" cy="55.5" rx="9" ry="2" fill="#FFFFFF" opacity="0.6" />

    <!-- Specular Gloss Highlight Curve on Glass Bowl Left -->
    <path d="M18 21 Q19 36 29 41" fill="none" stroke="url(#glassGloss)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Sparkle near rim -->
  <g transform="translate(13, 15)">
    <path d="M0 -5 Q0 0 5 0 Q0 0 0 5 Q0 0 -5 0 Q0 0 0 -5 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
