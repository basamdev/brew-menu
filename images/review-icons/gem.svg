<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="gemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
    <radialGradient id="gemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gemTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="gemCrown1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="gemCrown2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="gemPavCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="gemPavLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gemPavRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="gemRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#gemAura)" />

  <g filter="url(#gemShadow)">
    <!-- Pavilion (Lower Body) -->
    <!-- Center Pavilion Facet -->
    <polygon points="22,26 42,26 32,58" fill="url(#gemPavCenter)" />
    <!-- Left Pavilion Facet -->
    <polygon points="6,26 22,26 32,58" fill="url(#gemPavLeft)" />
    <!-- Right Pavilion Facet -->
    <polygon points="42,26 58,26 32,58" fill="url(#gemPavRight)" />

    <!-- Crown (Upper Body) -->
    <!-- Table Facet (Top Flat Surface) -->
    <polygon points="20,10 44,10 40,26 24,26" fill="url(#gemTable)" stroke="url(#gemRim)" stroke-width="0.7" />

    <!-- Crown Left Outer Triangle -->
    <polygon points="6,26 18,10 20,10 24,26" fill="url(#gemCrown1)" stroke="url(#gemRim)" stroke-width="0.7" />
    <polygon points="6,26 18,10 20,10" fill="#BAE6FD" opacity="0.6" />

    <!-- Crown Right Outer Triangle -->
    <polygon points="58,26 46,10 44,10 40,26" fill="url(#gemCrown2)" stroke="url(#gemRim)" stroke-width="0.7" />
    <polygon points="58,26 46,10 44,10" fill="#C7D2FE" opacity="0.6" />

    <!-- Center Upper Kite Facet -->
    <polygon points="24,26 32,10 40,26 32,26" fill="#F0F9FF" opacity="0.9" />

    <!-- Girdle Line (Middle Belt) -->
    <line x1="6" y1="26" x2="58" y2="26" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Outer Facet Outlines for 3D Definition -->
    <polygon points="18,10 46,10 58,26 32,58 6,26" fill="none" stroke="url(#gemRim)" stroke-width="1.4" stroke-linejoin="round" />
  </g>

  <!-- Primary Diamond Sparkle (Top-Left Girdle) -->
  <g transform="translate(19, 10)">
    <path d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="0" r="1.5" fill="#BAE6FD" />
  </g>

  <!-- Secondary Sparkle (Center Right) -->
  <g transform="translate(48, 22)">
    <path d="M0 -4.5 Q0 0 4.5 0 Q0 0 0 4.5 Q0 0 -4.5 0 Q0 0 0 -4.5 Z" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>
