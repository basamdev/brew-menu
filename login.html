<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Admin Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div id="loginError" class="error-message"></div>
            </form>
        </div>
    </div>
    
    <!-- Firebase SDKs - Load these BEFORE firebase.js -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
      import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
      import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, setDoc, writeBatch, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
      import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-analytics.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCRPdqIjA-S-VwBNt-8FEDDvkkfKfjSK8s",
        authDomain: "brew-coffee-1cd84.firebaseapp.com",
        projectId: "brew-coffee-1cd84",
        storageBucket: "brew-coffee-1cd84.firebasestorage.app",
        messagingSenderId: "96919307440",
        appId: "1:96919307440:web:2450c01c4a1bd604e66775",
        measurementId: "G-X0D6048HLC"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      if (typeof isSupported === 'function') {
        isSupported().then(function(supported) {
          if (supported) {
            window.analytics = getAnalytics(app);
          }
        }).catch(function() {});
      }

      window.firebaseApp = app;
      window.auth = auth;
      window.db = db;
      window.firebaseConfig = firebaseConfig;
      window.setPersistence = setPersistence;
      window.browserLocalPersistence = browserLocalPersistence;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.onAuthStateChanged = onAuthStateChanged;
      window.collection = collection;
      window.doc = doc;
      window.getDoc = getDoc;
      window.getDocs = getDocs;
      window.addDoc = addDoc;
      window.updateDoc = updateDoc;
      window.deleteDoc = deleteDoc;
      window.query = query;
      window.where = where;
      window.orderBy = orderBy;
      window.limit = limit;
      window.onSnapshot = onSnapshot;
      window.setDoc = setDoc;
      window.writeBatch = writeBatch;
      window.serverTimestamp = serverTimestamp;
    </script>
