<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="application-name" content="BREW CAFE & REST">
    <meta name="msapplication-TileColor" content="#060A12">
    <meta name="msapplication-TileImage" content="assets/icon-512.png?v=30">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=208">
    <link rel="stylesheet" href="css/login.css?v=118">
</head>
<body>
    <div class="login-container">
        <div class="login-box" id="loginBox">
            <div class="login-brand">
                <a href="menu.html" title="BREW CAFE & REST">
                    <img src="images/Brew-logo.png?v=25" alt="BREW CAFE & REST" class="login-logo" onerror="this.style.display='none'">
                </a>
                <h1 class="login-brand-title">BREW CAFE & REST</h1>
                <p class="login-subtitle">چوونەژوورەوەی ئەدمین • Admin Portal</p>
            </div>
            
            <div id="loginError" class="login-error-alert" role="alert" style="display: none;">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="loginErrorText">Wrong email or wrong password</span>
            </div>

            <form id="loginForm" novalidate autocomplete="on">
                <div class="input-group">
                    <label for="email">
                        <i class="fa-regular fa-envelope"></i>
                        <span>ئیمەیڵ / Email</span>
                    </label>
                    <div class="input-field-wrap">
                        <input type="email" id="email" placeholder="brew@gmail.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fa-solid fa-lock"></i>
                        <span>وشەی نهێنی / Password</span>
                    </label>
                    <div class="input-field-wrap">
                        <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" required>
                        <button type="button" class="pwd-toggle-btn" id="pwdToggleBtn" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye" id="pwdEyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">چوونەژوورەوە • Login</span>
                    <span class="btn-spinner" style="display: none;"><i class="fa-solid fa-circle-notch fa-spin"></i> تکایە چاوەڕێبە...</span>
                </button>
            </form>

            <div class="login-footer">
                <a href="menu.html" class="back-to-menu-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>گەڕانەوە بۆ مێنیو / Back to Menu</span>
                </a>
            </div>
        </div>
    </div>
    
    <!-- Firebase SDKs - Load these BEFORE firebase.js -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
      import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
      import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, setDoc, writeBatch, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
      import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-analytics.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCRPdqIjA-S-VwBNt-8FEDDvkkfKfjSK8s",
        authDomain: "brew-coffee-1cd84.firebaseapp.com",
        projectId: "brew-coffee-1cd84",
        storageBucket: "brew-coffee-1cd84.firebasestorage.app",
        messagingSenderId: "96919307440",
        appId: "1:96919307440:web:2450c01c4a1bd604e66775",
        measurementId: "G-X0D6048HLC"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      if (typeof isSupported === 'function') {
        isSupported().then(function(supported) {
          if (supported) {
            window.analytics = getAnalytics(app);
          }
        }).catch(function() {});
      }

      window.firebaseApp = app;
      window.auth = auth;
      window.db = db;
      window.firebaseConfig = firebaseConfig;
      window.setPersistence = setPersistence;
      window.browserLocalPersistence = browserLocalPersistence;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.onAuthStateChanged = onAuthStateChanged;
      window.collection = collection;
      window.doc = doc;
      window.getDoc = getDoc;
      window.getDocs = getDocs;
      window.addDoc = addDoc;
      window.updateDoc = updateDoc;
      window.deleteDoc = deleteDoc;
      window.query = query;
      window.where = where;
      window.orderBy = orderBy;
      window.limit = limit;
      window.onSnapshot = onSnapshot;
      window.setDoc = setDoc;
      window.writeBatch = writeBatch;
      window.serverTimestamp = serverTimestamp;
    </script>
    
    <!-- Local Firebase Config -->
    <script src="js/firebase.js?v=126"></script>
    
    <!-- App.js for theme handling -->
    <script src="js/app.js?v=196"></script>
    
    <!-- Local API -->
    <script src="js/local-api.js?v=120"></script>
    
    <!-- Login Script -->
    <script src="js/login.js?v=118"></script>
</body>
</html>
