<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BREW CAFE & REST</title>
    <link rel="manifest" href="manifest.json?v=125">
    <link rel="icon" type="image/png" href="images/Brew-logo.png?v=25">
    <link rel="shortcut icon" type="image/png" href="images/Brew-logo.png?v=25">
    <link rel="apple-touch-icon" sizes="180x180" href="images/Brew-logo.png?v=25">
    <meta name="application-name" content="BREW CAFE & REST">
    <meta name="msapplication-TileColor" content="#00D2FF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BREW CAFE & REST">
    <meta name="theme-color" content="#12100E">
    
    <!-- Google Fonts: Luxury Kurdish (Noto Kufi Arabic, Vazirmatn, Noto Sans Arabic) & Modern Latin (Outfit, Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Luxury Kurdish Typography Stack: Full native Sorani Kurdish OpenType support */
            --font-ku: 'Noto Kufi Arabic', 'Vazirmatn', 'Noto Sans Arabic', 'Rabar', 'Unikurd', 'Segoe UI', system-ui, sans-serif;
            --font-ar: 'Noto Kufi Arabic', 'Vazirmatn', 'Noto Sans Arabic', 'Cairo', 'Tajawal', sans-serif;
            --font-en: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Playfair Display', 'Cinzel', serif;
            
            /* Brew Coffee Signature Palette (Matching Brew Logo) */
            --brew-cyan: #00F5D4;
            --brew-blue: #00D2FF;
            --brew-royal: #0077FE;
            --brew-neon: #00F0FF;
            --brew-glow: rgba(0, 210, 255, 0.55);
            --brew-dark-bg: rgba(9, 13, 20, 0.9);
            --brew-dark-hover: rgba(14, 20, 32, 0.96);
            --brew-text: #E6F9FF;
            
            /* Neon Electric Blue/Cyan (Matching Logo) */
            --neon-blue: #00F0FF;
            --neon-blue-glow: rgba(0, 240, 255, 0.65);
            
            --bg-dark: #0D0C0B;
            --text-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: var(--font-ku);
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Kurdish Specific Typography - Never destroy cursive connections */
        html[lang="ku"],
        body[data-lang="ku"] {
            font-family: var(--font-ku) !important;
        }

        body[data-lang="ku"] * {
            font-family: var(--font-ku);
            letter-spacing: 0 !important;
        }

        /* Arabic Specific Typography */
        html[lang="ar"],
        body[data-lang="ar"] {
            font-family: var(--font-ar) !important;
        }

        body[data-lang="ar"] * {
            font-family: var(--font-ar);
            letter-spacing: 0 !important;
        }

        /* English Specific Typography */
        html[lang="en"],
        body[data-lang="en"] {
            font-family: var(--font-en);
        }

        body[data-lang="en"] * {
            font-family: var(--font-en);
        }

        .smart-serve-name {
            font-family: var(--font-en) !important;
            letter-spacing: 0.04em !important;
        }

        /* ----------------------------------------------------
           FULLSCREEN AUTHENTIC BREW CAFE PHOTO BACKGROUND
        ---------------------------------------------------- */
        .landing-bg-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: #080C14;
        }

        .landing-bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
            filter: brightness(0.74) contrast(1.08) saturate(1.12);
            animation: brewBgSubtleZoom 26s ease-in-out infinite alternate;
            transform-origin: center 30%;
            display: block;
        }

        @keyframes brewBgSubtleZoom {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.06);
            }
        }

        .landing-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at 50% 35%,
                rgba(6, 10, 18, 0.12) 0%,
                rgba(6, 10, 18, 0.48) 65%,
                rgba(6, 10, 18, 0.88) 100%
            );
        }

        .landing-overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(6, 10, 18, 0.84) 0%,
                rgba(6, 10, 18, 0.22) 20%,
                rgba(6, 10, 18, 0.15) 50%,
                rgba(6, 10, 18, 0.55) 75%,
                rgba(6, 10, 18, 0.92) 95%,
                #060A12 100%
            );
        }

        /* ----------------------------------------------------
           APP WRAPPER & SAFE AREAS
        ---------------------------------------------------- */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            height: 100dvh;
            padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        }

        /* ----------------------------------------------------
           TOP HEADER: LANGUAGE BUTTON (LEFT) & BRAND (RIGHT: TEXT + LOGO)
           LOCKED DIRECTION: NEVER FLIPS ON LANGUAGE CHANGE
        ---------------------------------------------------- */
        .top-header,
        html[dir="rtl"] .top-header,
        html[dir="ltr"] .top-header,
        body[data-lang] .top-header {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: row !important;
            align-items: center;
            justify-content: space-between;
            direction: ltr !important; /* FIXED: NEVER FLIPS ON LANGUAGE SWITCH */
            gap: 10px;
            padding: 4px 2px;
        }

        /* Brand Group: Text on left, Logo on right */
        .top-brand-group,
        html[dir="rtl"] .top-brand-group,
        html[dir="ltr"] .top-brand-group,
        body[data-lang] .top-brand-group {
            display: inline-flex;
            flex-direction: row !important;
            align-items: center;
            direction: ltr !important; /* FIXED: TEXT LEFT, LOGO RIGHT */
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            user-select: none;
            flex-shrink: 0;
        }

        .top-logo-badge {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            box-shadow: none;
            border: none;
            padding: 0;
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .top-brand-group:hover .top-logo-badge {
            transform: scale(1.08);
        }

        .top-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0;
            display: block;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.75)) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.85));
            transition: filter 0.28s ease, transform 0.28s ease;
        }

        .top-brand-group:hover .top-logo-img {
            filter: drop-shadow(0 0 16px rgba(0, 245, 212, 0.95)) drop-shadow(0 0 28px rgba(0, 210, 255, 0.7)) drop-shadow(0 5px 12px rgba(0, 0, 0, 0.9));
        }

        /* Animated Title beside Logo */
        .top-title-typewriter {
            display: inline-flex;
            align-items: center;
            line-height: 1.2;
            min-height: 24px;
        }

        .typewriter-text {
            font-size: clamp(1.02rem, 3.8vw, 1.25rem);
            font-weight: 800;
            background: linear-gradient(135deg, #00F5D4 0%, #00D2FF 40%, #0077FE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.65));
            letter-spacing: 0;
            white-space: nowrap;
            min-height: 1.3em;
            display: inline-block;
            transition: all 0.15s ease;
            font-feature-settings: "liga" 1, "calt" 1;
        }

        [dir="rtl"] .typewriter-text,
        body[data-lang="ku"] .typewriter-text,
        body[data-lang="ar"] .typewriter-text {
            letter-spacing: 0 !important;
            font-family: var(--font-ku);
        }

        .typewriter-cursor {
            display: inline-block;
            font-size: 1.2rem;
            font-weight: 300;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue), 0 0 18px var(--neon-blue-glow);
            animation: cursorBlink 0.8s infinite ease-in-out;
            margin-inline-start: 2px;
            vertical-align: middle;
            line-height: 1;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ----------------------------------------------------
           LIVE MOVING LIGHT BORDER (BREW LOGO THEME)
           Continuously traces the line shape / perimeter contour of buttons
        ---------------------------------------------------- */
        .live-light-btn {
            position: relative !important;
            isolation: isolate;
            overflow: hidden !important;
            border: none !important;
            background: transparent !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.65), 0 0 16px rgba(0, 210, 255, 0.22);
            transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.24s ease;
        }

        /* Continuous rotating light beam around the line shape */
        .live-light-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 620px;
            height: 620px;
            transform: translate(-50%, -50%) rotate(0deg);
            background: conic-gradient(
                from 0deg,
                rgba(0, 210, 255, 0.14) 0deg,
                rgba(0, 210, 255, 0.14) 230deg,
                rgba(0, 245, 212, 0.35) 275deg,
                #00F5D4 315deg,
                #00D2FF 342deg,
                #FFFFFF 356deg,
                #0077FE 359deg,
                rgba(0, 210, 255, 0.14) 360deg
            );
            animation: liveLightRotate 3s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        /* Inner masking surface leaving a razor-sharp 1.6px live border line track */
        .live-light-btn::after {
            content: '';
            position: absolute;
            inset: 1.6px;
            border-radius: inherit;
            background: linear-gradient(155deg, rgba(12, 19, 32, 0.94) 0%, rgba(6, 10, 18, 0.97) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: inset 0 1px 1.5px rgba(0, 240, 255, 0.28), inset 0 -1px 1.5px rgba(0, 0, 0, 0.7);
            z-index: 2;
            pointer-events: none;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        /* All child content stays crisp and interactive above the mask */
        .live-light-btn > * {
            position: relative;
            z-index: 3;
        }

        .live-light-btn:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.75), 0 0 28px rgba(0, 210, 255, 0.55);
        }

        .live-light-btn:hover::after {
            background: linear-gradient(155deg, rgba(16, 26, 44, 0.95) 0%, rgba(8, 14, 24, 0.98) 100%);
            box-shadow: inset 0 1px 2px rgba(0, 240, 255, 0.45), inset 0 -1px 2px rgba(0, 0, 0, 0.85);
        }

        .live-light-btn:hover::before {
            animation-duration: 1.8s; /* Light speeds up dynamically on hover */
        }

        @keyframes liveLightRotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* Language Button Pill (Brew Logo Theme) */
        .lang-dropdown-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .lang-trigger-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 14px;
            padding: 7px 14px;
            color: #E6F9FF;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .lang-trigger-btn::before {
            animation-duration: 2.8s;
        }

        .lang-trigger-btn:hover {
            transform: translateY(-1px);
        }

        .lang-trigger-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Language Flag Icon in Trigger Button */
        .lang-trigger-flag-img {
            width: 21px;
            height: 14.5px;
            object-fit: cover;
            border-radius: 3px;
            box-shadow: 0 0 6px rgba(0, 210, 255, 0.45);
            border: 1px solid rgba(0, 240, 255, 0.45);
            display: block;
            flex-shrink: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .lang-trigger-btn:hover .lang-trigger-flag-img {
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.75);
        }

        .lang-trigger-text {
            color: #E6F9FF;
            letter-spacing: 0.02em;
            line-height: 1;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .lang-chevron-triangle {
            font-size: 0.65rem;
            color: #00D2FF;
            line-height: 1;
            transition: transform 0.2s ease;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.85);
        }

        .lang-dropdown-wrapper.open .lang-chevron-triangle {
            transform: rotate(180deg);
        }

        /* Floating Language Menu (Brew Obsidian & Neon Cyan Theme) */
        .lang-popover-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0 !important;
            right: auto !important;
            min-width: 175px;
            background: rgba(8, 14, 24, 0.96);
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 14px;
            padding: 6px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85), 0 0 24px rgba(0, 210, 255, 0.25);
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 100;
        }

        .lang-dropdown-wrapper.open .lang-popover-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .lang-option-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: #E6F9FF;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: inherit;
        }

        .lang-option-content {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .lang-option-flag-img {
            width: 22px;
            height: 15px;
            object-fit: cover;
            border-radius: 3px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.22);
            display: block;
            flex-shrink: 0;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .lang-option-btn:hover {
            background: rgba(0, 210, 255, 0.14);
            color: #00F5D4;
        }

        .lang-option-btn:hover .lang-option-flag-img {
            transform: scale(1.1);
            border-color: #00F5D4;
            box-shadow: 0 0 8px rgba(0, 245, 212, 0.6);
        }

        .lang-option-btn.active {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.24) 0%, rgba(0, 119, 254, 0.3) 100%);
            font-weight: 700;
            color: #FFFFFF;
            border: 1px solid rgba(0, 240, 255, 0.45);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .lang-option-btn.active .lang-option-flag-img {
            border-color: #00D2FF;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.7);
        }

        .lang-option-name {
            font-size: 0.93rem;
            line-height: 1;
            letter-spacing: 0.01em;
        }

        .lang-opt-check {
            font-size: 0.85rem;
            color: #00F5D4;
            text-shadow: 0 0 8px #00F5D4;
            opacity: 0;
        }

        .lang-option-btn.active .lang-opt-check {
            opacity: 1;
        }

        /* ----------------------------------------------------
           CENTER VIEW (CLEAN ATMOSPHERIC CAFE AMBIANCE)
        ---------------------------------------------------- */
        .center-spacer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ----------------------------------------------------
           BOTTOM CONTROLS (BREW LOGO THEME WITH LIVE LIGHT BORDER)
        ---------------------------------------------------- */
        .bottom-dock {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-bottom: 4px;
        }

        /* Primary "Menu" Button with Live Moving Light */
        .menu-main-cta {
            width: 100%;
            max-width: 380px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
        }

        .menu-main-cta::before {
            animation-duration: 3.2s;
        }

        .menu-main-cta:hover {
            transform: translateY(-2px);
        }

        .menu-main-cta:active {
            transform: translateY(1px) scale(0.985);
        }

        #menuBtnLabel {
            background: linear-gradient(135deg, #00F5D4 0%, #00D2FF 45%, #FFFFFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.7));
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            line-height: 1;
            display: inline-block;
        }

        /* Quick Action Row: Location & Instagram Squircles with Live Moving Light */
        .quick-actions-row {
            display: flex;
            flex-direction: row !important;
            direction: ltr !important;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .action-squircle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
        }

        .action-squircle-btn::before {
            animation-duration: 2.5s;
        }

        .action-squircle-btn:hover {
            transform: translateY(-2px) scale(1.06);
        }

        .action-squircle-btn:active {
            transform: translateY(0) scale(0.96);
        }

        .action-squircle-btn svg {
            width: 25px;
            height: 25px;
            filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.85));
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .action-squircle-btn:hover svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 14px rgba(0, 240, 255, 1));
        }

        /* ----------------------------------------------------
           POWERED BY (TOP) & SMART SERVE LOGO + NAME (BOTTOM)
        ---------------------------------------------------- */
        .powered-by-section {
            display: inline-flex;
            flex-direction: column !important;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            user-select: none;
        }

        .powered-by-section:hover {
            transform: scale(1.03);
        }

        .powered-by-text {
            font-size: 0.76rem;
            color: #A3A3A3;
            font-weight: 500;
            letter-spacing: 0.04em;
            line-height: 1;
            text-align: center;
            transition: color 0.2s ease;
        }

        body[data-lang="ku"] .powered-by-text {
            font-family: var(--font-ku) !important;
            letter-spacing: 0 !important;
            font-size: 0.84rem;
            font-weight: 600;
        }

        body[data-lang="ar"] .powered-by-text {
            font-family: var(--font-ar) !important;
            letter-spacing: 0 !important;
            font-size: 0.84rem;
            font-weight: 600;
        }

        body[data-lang="ku"] #menuBtnLabel {
            font-family: var(--font-ku) !important;
            letter-spacing: 0 !important;
            font-weight: 800;
            font-size: 1.35rem;
        }

        body[data-lang="ar"] #menuBtnLabel {
            font-family: var(--font-ar) !important;
            letter-spacing: 0 !important;
            font-weight: 800;
            font-size: 1.35rem;
        }

        .powered-by-brand-row {
            display: inline-flex;
            flex-direction: row !important;
            direction: ltr !important;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .smart-serve-emblem-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            background: #000000;
            box-shadow: 0 0 10px rgba(0, 195, 255, 0.45), 0 0 16px rgba(168, 85, 247, 0.35);
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.5);
            flex-shrink: 0;
        }

        .smart-serve-emblem-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .smart-serve-name {
            font-family: var(--font-en);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #00F5D4 0%, #00C6FF 45%, #A855F7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        /* Mobile Layout Adjustments */
        @media (max-width: 400px) {
            .top-logo-badge {
                width: 42px;
                height: 42px;
                min-width: 42px;
            }
            .typewriter-text {
                font-size: 0.98rem;
            }
            .lang-trigger-btn {
                padding: 6px 11px;
                font-size: 0.88rem;
            }
        }

        @media (max-height: 640px) {
            .menu-main-cta {
                height: 48px;
                font-size: 1.15rem;

            .action-squircle-btn {
                width: 48px;
                height: 48px;
            }
            .smart-serve-emblem-wrap {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body class="index-page">

    <!-- Fullscreen Authentic Brew Cafe Photo Background -->
    <div class="landing-bg-container">
        <img src="images/brew-cafe-bg.jpg?v=2" alt="Brew Cafe & Rest" class="landing-bg-img" id="landingBgImg" fetchpriority="high">
        <div class="landing-overlay"></div>
        <div class="landing-overlay-gradient"></div>
    </div>

    <!-- Main Viewport Content -->
    <main class="app-container">
        
        <!-- TOP HEADER: Language Button (Left) & Brand (Right: Text + Logo) -->
        <header class="top-header">
            <!-- Language Button (Left side) with Live Moving Light -->
            <div class="lang-dropdown-wrapper" id="langDropdownWrapper">
                <button type="button" class="lang-trigger-btn live-light-btn" id="langTriggerBtn" aria-haspopup="true" aria-expanded="false" title="Change Language">
                    <!-- Dynamic Active Flag (Kurdish, Iraq, or British) -->
                    <img src="images/flag-uk.svg" alt="Language" class="lang-trigger-flag-img" id="currentLangFlag">
                    <span class="lang-trigger-text" id="currentLangLabel">English</span>
                    <span class="lang-chevron-triangle" aria-hidden="true">▼</span>
                </button>

                <!-- Floating Language Selector Menu with Flags -->
                <div class="lang-popover-menu" id="langPopoverMenu" role="menu">
                    <!-- Kurdish (flag-kurdistan.svg) -->
                    <button type="button" class="lang-option-btn" data-lang="ku" role="menuitem">
                        <span class="lang-option-content">
                            <img src="images/flag-kurdistan.svg" alt="Kurdish Flag" class="lang-option-flag-img">
                            <span class="lang-option-name">کوردی</span>
                        </span>
                        <span class="lang-opt-check">✓</span>
                    </button>
                    <!-- Arabic (flag-iraq.svg) -->
                    <button type="button" class="lang-option-btn" data-lang="ar" role="menuitem">
                        <span class="lang-option-content">
                            <img src="images/flag-iraq.svg" alt="Iraq Flag" class="lang-option-flag-img">
                            <span class="lang-option-name">العربية</span>
                        </span>
                        <span class="lang-opt-check">✓</span>
                    </button>
                    <!-- English (flag-uk.svg) -->
                    <button type="button" class="lang-option-btn" data-lang="en" role="menuitem">
                        <span class="lang-option-content">
                            <img src="images/flag-uk.svg" alt="British Flag" class="lang-option-flag-img">
                            <span class="lang-option-name">English</span>
                        </span>
                        <span class="lang-opt-check">✓</span>
                    </button>
                </div>
            </div>

            <!-- Brand Group (Right side: Text on left, Logo on right) -->
            <div class="top-brand-group" id="indexLogoWrap" title="Double click for Admin">
                <div class="top-title-typewriter" id="topTitleTypewriter" aria-live="polite">
                    <span class="typewriter-text" id="typewriterText">BREW CAFE & REST</span><span class="typewriter-cursor">|</span>
                </div>
                <div class="top-logo-badge">
                    <img src="images/Brew-logo.png?v=25" alt="BREW CAFE & REST" class="top-logo-img" id="indexLogo"
                         onerror="this.onerror=null; this.src='images/zayed-logo.png?v=25';">
                </div>
            </div>
        </header>

        <!-- CENTER VIEW (SPACIOUS CINEMATIC VIEW) -->
        <div class="center-spacer"></div>

        <!-- BOTTOM CONTROLS DOCK (BREW THEME WITH LIVE LIGHT BORDER) -->
        <section class="bottom-dock">
            <!-- Primary "Menu" Button with Live Moving Light -->
            <a href="menu.html" class="menu-main-cta live-light-btn" id="menuMainCta" aria-label="Open Menu">
                <span id="menuBtnLabel">Menu</span>

            <!-- Quick Action Row: Location & Instagram Squircles with Live Moving Light -->
            <div class="quick-actions-row">
                <!-- Location (Google Maps) -->
                <a href="#" target="_blank" rel="noopener" class="action-squircle-btn live-light-btn btn-location" id="cafeLocationBtn" aria-label="Location" title="Location">
                    <!-- Pin Icon in Brew Electric Cyan -->
                    <svg viewBox="0 0 24 24" fill="#00D2FF" aria-hidden="true">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                </a>
                <!-- Instagram -->
                <a href="#" target="_blank" rel="noopener" class="action-squircle-btn live-light-btn btn-instagram" id="cafeInstagramBtn" aria-label="Instagram" title="Instagram">
                    <!-- Instagram Camera Icon in Brew Electric Cyan -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="#00D2FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                        <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>

            <!-- Powered by on top, Logo + Smart Serve on bottom -->
            <div class="powered-by-section" id="poweredBySection">
                <span class="powered-by-text" id="poweredByLabel">Powered by</span>
                <div class="powered-by-brand-row">
                    <div class="smart-serve-emblem-wrap" title="Smart Serve">
                        <img src="images/smart-serve-logo.png?v=3" alt="Smart Serve" class="smart-serve-emblem-img">
                    </div>
                    <span class="smart-serve-name">Smart Serve</span>
                </div>

    </main>

    <!-- Core App Logic & Settings -->
    <script src="js/app.js?v=156"></script>
    <script>
        (function () {
            'use strict';

            // Translations Dictionary
            var I18N = {
                ku: {
                    dir: 'rtl',
                    label: 'کوردی',
                    flag: 'images/flag-kurdistan.svg',
                    menuBtn: 'مێنوو',
                    poweredBy: 'پشتگیری کراوە لەلایەن',
                    title: 'بریو کافێ'
                },
                ar: {
                    dir: 'rtl',
                    label: 'العربية',
                    flag: 'images/flag-iraq.svg',
                    menuBtn: 'المنيو',
                    poweredBy: 'التطوير بواسطة',
                    title: 'بریو کوفي'
                },
                en: {
                    dir: 'ltr',
                    label: 'English',
                    flag: 'images/flag-uk.svg',
                    menuBtn: 'Menu',
                    poweredBy: 'Powered by',
                    title: 'BREW CAFE & REST'
                }
            };

            // Read current language or fallback to English or Kurdish
            var currentLang = localStorage.getItem('selectedLang') || 'en';
            if (!I18N[currentLang]) currentLang = 'en';

            // DOM Elements
            var htmlEl = document.documentElement;
            var bodyEl = document.body;
            var currentLangLabel = document.getElementById('currentLangLabel');
            var currentLangFlag = document.getElementById('currentLangFlag');
            var menuBtnLabel = document.getElementById('menuBtnLabel');
            var menuMainCta = document.getElementById('menuMainCta');
            var poweredByLabel = document.getElementById('poweredByLabel');

            var langWrapper = document.getElementById('langDropdownWrapper');
            var langTriggerBtn = document.getElementById('langTriggerBtn');
            var langOptionBtns = document.querySelectorAll('.lang-option-btn');

            var locationBtn = document.getElementById('cafeLocationBtn');
            var instagramBtn = document.getElementById('cafeInstagramBtn');
            var indexLogoWrap = document.getElementById('indexLogoWrap');
            var indexLogo = document.getElementById('indexLogo');

            // Apply selected language
            function applyLanguage(lang) {
                if (!I18N[lang]) lang = 'en';
                currentLang = lang;
                try { localStorage.setItem('selectedLang', lang); } catch (e) {}

                var data = I18N[lang];
                htmlEl.setAttribute('lang', lang);
                htmlEl.setAttribute('dir', data.dir);
                bodyEl.setAttribute('data-lang', lang);

                // Update UI text and active flag
                currentLangLabel.textContent = data.label;
                if (currentLangFlag && data.flag) {
                    currentLangFlag.src = data.flag;
                    currentLangFlag.alt = data.label;
                }
                menuBtnLabel.textContent = data.menuBtn;
                if (poweredByLabel) {
                    poweredByLabel.textContent = data.poweredBy;
                }

                // Update Menu CTA link
                menuMainCta.href = 'menu.html?lang=' + encodeURIComponent(lang);

                // Jump typewriter to active language for immediate testing
                if (window.jumpIndexTypewriter) {
                    window.jumpIndexTypewriter(lang);
                }

                // Update active class on dropdown options
                langOptionBtns.forEach(function (btn) {
                    if (btn.getAttribute('data-lang') === lang) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            // Language Dropdown Toggle
            function toggleLangMenu(e) {
                if (e) e.stopPropagation();
                var isOpen = langWrapper.classList.toggle('open');
                langTriggerBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            }

            function closeLangMenu() {
                langWrapper.classList.remove('open');
                langTriggerBtn.setAttribute('aria-expanded', 'false');
            }

            langTriggerBtn.addEventListener('click', toggleLangMenu);

            langOptionBtns.forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var selected = btn.getAttribute('data-lang');
                    applyLanguage(selected);
                    closeLangMenu();
                });
            });

            // Close dropdown on outside click or escape key
            document.addEventListener('click', function (e) {
                if (!langWrapper.contains(e.target)) {
                    closeLangMenu();
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeLangMenu();
            });

            // ----------------------------------------------------
            // Typewriter Animation for Title:
            // English: BREW CAFE & REST | Kurdish: بریو کافێ | Arabic: بریو کوفي
            // Color: Electric Blue matching the logo
            // ----------------------------------------------------
            (function initTitleTypewriter() {
                var words = [
                    { text: 'BREW CAFE & REST', lang: 'en' },
                    { text: 'بریو کوفي', lang: 'ar' },
                    { text: 'بریو کافێ', lang: 'ku' }
                ];
                var textEl = document.getElementById('typewriterText');
                if (!textEl) return;

                var wordIdx = 0;
                var charIdx = 0;
                var isDeleting = false;
                var typingSpeed = 95;
                var deleteSpeed = 48;
                var pauseEnd = 2000;
                var pauseStart = 350;
                var typeTimer = null;

                window.jumpIndexTypewriter = function(lang) {
                    var idx = -1;
                    for (var i = 0; i < words.length; i++) {
                        if (words[i].lang === lang) { idx = i; break; }
                    }
                    if (idx !== -1) {
                        wordIdx = idx;
                        charIdx = 0;
                        isDeleting = false;
                        if (typeTimer) clearTimeout(typeTimer);
                        typeLoop();
                    }
                };

                function typeLoop() {
                    var current = words[wordIdx];
                    var chars = Array.from(current.text);

                    // Apply proper font and zero letter-spacing before inserting characters
                    if (current.lang === 'ku') {
                        textEl.style.fontFamily = "var(--font-ku)";
                        textEl.style.letterSpacing = "0";
                    } else if (current.lang === 'ar') {
                        textEl.style.fontFamily = "var(--font-ar)";
                        textEl.style.letterSpacing = "0";
                    } else {
                        textEl.style.fontFamily = "var(--font-en)";
                        textEl.style.letterSpacing = "0.04em";
                    }

                    if (isDeleting) {
                        charIdx--;
                        textEl.textContent = chars.slice(0, charIdx).join('');
                        if (charIdx <= 0) {
                            isDeleting = false;
                            wordIdx = (wordIdx + 1) % words.length;
                            typeTimer = setTimeout(typeLoop, pauseStart);
                            return;
                        }
                        typeTimer = setTimeout(typeLoop, deleteSpeed);
                    } else {
                        charIdx++;
                        textEl.textContent = chars.slice(0, charIdx).join('');
                        if (charIdx >= chars.length) {
                            isDeleting = true;
                            typeTimer = setTimeout(typeLoop, pauseEnd);
                            return;
                        }
                        typeTimer = setTimeout(typeLoop, typingSpeed);
                    }
                }

                typeLoop();
            })();

            // Wire Location & Instagram links
            function setupQuickLinks() {
                var info = typeof getCafeInfo === 'function' ? getCafeInfo() : {};
                
                // Location URL
                var locUrl = (info && info.locationUrl) || localStorage.getItem('cafeLocationUrl') || 'https://maps.app.goo.gl/mmi5iv7mnGKxKZoq9?g_st=ic';
                if (locationBtn) {
                    locationBtn.href = locUrl;
                }

                // Instagram URL
                var instaHandle = (info && info.instagram) || localStorage.getItem('cafeInstagram') || '';
                var instaUrl = 'https://instagram.com/brew_coffee';
                if (instaHandle) {
                    if (typeof normalizeSocialUrl === 'function') {
                        instaUrl = normalizeSocialUrl(instaHandle, 'instagram');
                    } else if (instaHandle.indexOf('http') === 0) {
                        instaUrl = instaHandle;
                    } else {
                        instaUrl = 'https://instagram.com/' + instaHandle.replace(/^@/, '');
                    }
                }
                if (instagramBtn) {
                    instagramBtn.href = instaUrl;
                }
            }

            // Logo Click Actions: Single click opens menu, Double click opens admin
            function setupLogoActions(targetEl) {
                if (!targetEl) return;
                if (typeof setupLogoClickActions === 'function') {
                    setupLogoClickActions(targetEl, function () {
                        window.location.href = 'menu.html?lang=' + encodeURIComponent(currentLang);
                    }, 'admin.html');
                } else {
                    var clicks = 0;
                    var timer = null;
                    targetEl.addEventListener('click', function (e) {
                        e.preventDefault();
                        clicks++;
                        if (clicks === 1) {
                            timer = setTimeout(function () {
                                clicks = 0;
                                window.location.href = 'menu.html?lang=' + encodeURIComponent(currentLang);
                            }, 320);
                        } else if (clicks === 2) {
                            clearTimeout(timer);
                            clicks = 0;
                            window.location.href = 'admin.html';
                        }
                    });
                }
            }

            setupLogoActions(indexLogoWrap);
            if (indexLogo && indexLogo !== indexLogoWrap) {
                setupLogoActions(indexLogo);
            }

            // Initialize
            applyLanguage(currentLang);
            setupQuickLinks();

        })();
    </script>
</body>
