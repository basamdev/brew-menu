    <style>
        /* Auth Gate - Hide admin UI completely until authenticated */
        .admin-container {
            display: none !important;
        }
        body.admin-authenticated .admin-container {
            display: flex !important;
        }
        .admin-auth-guard {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: #060A12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #FAF8F5;
            font-family: 'Inter', 'Noto Kufi Arabic', sans-serif;
            transition: opacity 0.3s ease;
        }
        .admin-auth-guard-logo {
            width: 72px;
            height: auto;
            animation: pulseGateLogo 2s infinite ease-in-out;
            filter: drop-shadow(0 4px 16px rgba(212, 175, 55, 0.4));
        }
        .admin-auth-spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(212, 175, 55, 0.15);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spinGate 0.8s linear infinite;
        }
        .admin-auth-text {
            font-size: 0.9rem;
            color: rgba(212, 175, 55, 0.9);
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        @keyframes spinGate { to { transform: rotate(360deg); } }
        @keyframes pulseGateLogo { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.06); opacity: 1; } }
    </style>
